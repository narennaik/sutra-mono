name: Build and test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Build fonts from the skeleton sources
        run: make build
      - name: Run FontBakery (Google Fonts profile)
        run: |
          if ! make test; then
            echo "::group::FontBakery problems"
            grep -E ": (FAIL|ERROR|FATAL) " fontbakery.txt | sort -u | while read -r line; do
              echo "::error title=FontBakery::$line"
            done
            tail -40 fontbakery.txt | while read -r line; do echo "::notice title=FontBakery tail::$line"; done
            echo "::endgroup::"
            exit 1
          fi
      - name: Check that committed sources match the generator
        run: git diff --stat --exit-code -- sources || echo "::warning::UFO sources changed during the build; commit them."
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sutra-mono
          path: |
            fonts/ttf/*.ttf
            fontbakery-report.html
            fontbakery.txt
